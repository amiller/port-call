# Two seats, not one. A full loopback e2e needs a bot that SPEAKS and a bot that HEARS in the same
# call: seat A plays TTS through tts_sink and renders the camera HUD, seat B captures call_out and
# transcribes. No human in the room, which is what makes it a test rather than a demo.
services:
  signal-a:
    build: .
    container_name: port-call-signal-a
    # The loopback camera the HUD is rendered into. Host-side: modprobe v4l2loopback devices=1
    # video_nr=0 card_label=PortCallCam exclusive_caps=1. Only the speaker seat needs it.
    devices: ["/dev/video0:/dev/video0"]
    volumes: [signal-a-data:/data]
    ports: ["127.0.0.1:9333:9334", "127.0.0.1:6080:6080", "127.0.0.1:9336:9401"]   # CDP is unauthenticated: loopback only, reach via ssh tunnel
    shm_size: 512m
    restart: unless-stopped
  signal-b:
    build: .
    container_name: port-call-signal-b
    volumes: [signal-b-data:/data]
    ports: ["127.0.0.1:9335:9334", "127.0.0.1:6081:6080"]
    shm_size: 512m
    restart: unless-stopped
volumes:
  signal-a-data:
  signal-b-data:
