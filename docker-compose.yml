# The whole stack: the bot (vexa-lite with this repo's patches), its database, and the voice
# sidecar. Configuration comes from .env (see .env.example); `./pc up` is the usual way in.
#
#   cp .env.example .env && docker compose up -d --build
#
# The voice sidecar is a service rather than a host process because a confidential VM has no host
# to put it on; transcription is the one thing that runs on the host by default (Whisper, reached
# through host.docker.internal), with a cloud alternative behind the "transcribe" profile.
#
# Resource notes (measured on the laptop, 2026-08-10): a bot in a meeting costs ~1.4GB RSS and
# ~0.6 core steady, spiking to ~2.3 cores while Chromium starts. Size the host by concurrent
# meetings, not by this file. `max_concurrent_bots` is set per-user at the admin API.
services:
  postgres:
    image: postgres:17-alpine
    command: -c idle_in_transaction_session_timeout=60000
    environment:
      POSTGRES_DB: vexa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vexa"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Cloud transcription through near.ai. Off unless .env sets COMPOSE_PROFILES=transcribe and a
  # key; with it, meeting audio leaves the machine.
  near-shim:
    profiles: ["transcribe"]
    build: {context: ., dockerfile: Dockerfile.shims}
    image: vexa-shims:local
    command: uvicorn near-shim:app --host 0.0.0.0 --port 8001
    volumes: [./shims/near-shim.py:/app/near-shim.py:ro]
    environment:
      NEAR_API_KEY: ${NEAR_API_KEY:-}
      SHIM_LOG: metrics          # content-free diagnostics; "text" also logs transcripts
    restart: unless-stopped

  tts-shim:
    build: {context: ., dockerfile: Dockerfile.shims}
    image: vexa-shims:local
    command: uvicorn tts-shim:app --host 0.0.0.0 --port 8002
    volumes: [./shims/tts-shim.py:/app/tts-shim.py:ro, ./shims/sfx:/app/sfx:ro]
    environment:
      TTS_ENGINE: ${TTS_ENGINE:-piper}
    restart: unless-stopped

  vexa-lite:
    build: {context: ., dockerfile: Dockerfile.patched}
    image: vexa-lite:patched
    shm_size: 2gb
    depends_on:
      postgres: {condition: service_healthy}
    ports:
      # Loopback only. Upstream publishes these on every interface, which puts token minting and
      # the bot's desktop on whatever network the laptop joins. The ports come from .env so two
      # stacks can share a machine (promoting a tree once overwrote the staging ports with these
      # and the container failed on "port is already allocated").
      - "127.0.0.1:${VEXA_GW_PORT:-8056}:8056"     # gateway (the only front door)
      - "127.0.0.1:${VEXA_UI_PORT:-3000}:3000"
      # noVNC onto the bot's own X display. Needed to SEE the browser during provisionLogin — the
      # Google sign-in is the one step a human has to perform, and it cannot be done blind.
      - "127.0.0.1:${VEXA_VNC_PORT:-6080}:6080"
    # host.docker.internal: Docker Desktop and OrbStack define it; Docker Engine on Linux does not,
    # and the bot reaches transcription on the host through it.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - recordings:/var/lib/vexa/recordings
      # The signed-in Google profile. It MUST be a volume. It used to be written straight into the
      # container filesystem and was silently lost on the next recreate — which is how prod came to
      # be joining ANONYMOUSLY without anyone noticing, since e2e.sh uses an OPEN lab room where a
      # guest join succeeds and nothing goes red. Calendared meetings wall out anonymous
      # participants entirely, so the loss only shows up in a real meeting.
      - google-session:/var/lib/vexa/google-session-live
      # Hot-swap: edit TS on the host, `./hotswap.sh`, spawn a new bot. ~10s instead of a 5-minute
      # image rebuild + compose restart. Bots are per-meeting processes, so live bots are undisturbed.
      - ./live/services-bot-src:/app/core/meetings/services/bot/src
      - ./live/services-bot-dist:/app/core/meetings/services/bot/dist
      - ./live/modules-join-src:/app/core/meetings/modules/join/src
      - ./live/modules-join-dist:/app/core/meetings/modules/join/dist
    environment:
      # DB_HOST defaulting to "localhost" while postgres is a separate container is what silently
      # crash-looped admin-api and meeting-api for days. Never let this go unset.
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: vexa
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSL_MODE: disable
      ADMIN_API_TOKEN: ${ADMIN_TOKEN:-devadmintoken123}
      # Both from .env. With neither set transcription is off cleanly: no URL, so the bot skips
      # it (pipeline.ts createTranscribe), and TRANSCRIBE_ENABLED=false, because meeting-api
      # otherwise refuses every spawn with a 503 when transcription is wanted but unconfigured.
      TRANSCRIPTION_SERVICE_URL: ${TRANSCRIPTION_SERVICE_URL:-}
      TRANSCRIPTION_SERVICE_TOKEN: near
      TRANSCRIBE_ENABLED: ${TRANSCRIBE_ENABLED:-false}
      # Set in .env to send Meet audio to Pipecat on the host (pipecat_local.py); empty keeps the
      # bot's built-in lane. See patches/bot-pipeline.ts.
      PIPECAT_URL: ${PIPECAT_URL:-}
      # Off unless .env says otherwise. Upstream defaults it to true, and then every bot records
      # the meeting's audio into the container and tries to upload it to an object store this
      # stack does not have (meeting-api answers 500, "Invalid endpoint: http://"). A spawn
      # request that sets recording_enabled itself still wins over this default.
      RECORDING_ENABLED: ${RECORDING_ENABLED:-false}
      # Turns a listener bot into a measuring instrument: per-second [audio] RMS lines per speaker,
      # so "did that sound actually reach the meeting?" is answered by data, not by asking someone.
      VEXA_AUDIO_METER: "1"
      TTS_SERVICE_URL: http://tts-shim:8002
    restart: unless-stopped

volumes:
  google-session:
  pgdata:
  recordings:
