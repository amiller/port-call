<!doctype html>
<meta charset="utf-8">
<title>Mock Meet</title>
<!--
  A Meet-SHAPED DOM for exercising the control surfaces without a real meeting.

  Every selector here was taken from a live aria-label dump of Google Meet (see selfcheck's
  `buttons`/`inputs` output), not invented — so a controller that drives this drives the real
  thing, modulo Meet's own DOM drift. It deliberately reproduces the two behaviours that broke
  automation for real:
    1. the toolbar AUTO-HIDES after 3s of no pointer movement (controllers must wake it), and
    2. chat messages carry their content as a BARE TEXT NODE inside a div[data-message-id] with a
       nested hover BUTTON (also carrying data-message-id) polluting textContent — there is NO
       data-message-text attribute, and the stop-presenting control has no matching aria-label.
       Both were verified against real Meet after a mock built on assumption passed while
       production failed.
-->
<style>
  body { background:#202124; color:#e8eaed; font:15px system-ui, sans-serif; margin:0; height:100vh }
  #tiles { display:flex; gap:8px; padding:16px }
  .tile { width:260px; height:150px; background:#3c4043; border-radius:8px; padding:8px }
  #bar { position:fixed; bottom:0; left:0; right:0; display:flex; gap:8px; justify-content:center;
         padding:14px; background:#202124; transition:opacity .2s }
  #bar.hidden { opacity:0; pointer-events:none }
  button { background:#3c4043; color:#e8eaed; border:0; border-radius:20px; padding:12px 16px; cursor:pointer }
  #chat { position:fixed; right:0; top:0; width:320px; height:100%; background:#292a2d; padding:12px; display:none }
  #chat.open { display:block }
  #msgs { height:70%; overflow:auto }
  .msg { margin:8px 0; background:#3c4043; border-radius:8px; padding:8px }
  textarea { width:100%; height:60px; background:#202124; color:#e8eaed; border:1px solid #5f6368; border-radius:8px }
  #picker { position:fixed; bottom:70px; left:50%; transform:translateX(-50%); background:#292a2d;
            padding:10px; border-radius:12px; display:none }
  #picker.open { display:flex; gap:6px }
  video { width:100%; height:110px; background:#000 }
  #banner { position:fixed; top:8px; left:8px; background:#1a73e8; padding:6px 12px; border-radius:6px; display:none }
</style>

<div id="tiles">
  <div class="tile" data-participant-id="bot">Vexa E2E<video id="selfvid" autoplay muted></video></div>
  <div class="tile" data-participant-id="human">Someone Else</div>
</div>
<div id="banner">You are presenting</div>

<div id="bar">
  <button aria-label="Turn on microphone">mic</button>
  <button id="cam" aria-label="Turn on camera">cam</button>
  <button id="share" aria-label="Share screen">share</button>
  <button id="react" aria-label="Send a reaction">react</button>
  <button id="chatbtn" aria-label="Chat with everyone">chat</button>
  <button aria-label="Raise hand (ctrl + alt + h)">hand</button>
  <button aria-label="Leave call">leave</button>
</div>

<div id="picker">
  <!-- Meet's ACTUAL picker set, dumped from a live meeting. Rendered as <img alt> because that
       is how Meet does it — an earlier text-only mock let a controller pass that failed live. -->
  <button><img alt="🎊 🎊 🎊"></button>
  <button><img alt="💗 💗 💗"></button>
  <button><img alt="💯 💯 💯"></button>
  <button><img alt="😆 😆 😆"></button>
</div>

<div id="chat">
  <div id="msgs"></div>
  <textarea aria-label="Send a message" placeholder="Send a message"></textarea>
  <button aria-label="Send message" id="send">Send</button>
</div>

<script>
  // 1. Toolbar auto-hide — the behaviour that made every idle act time out against real Meet.
  const bar = document.getElementById('bar');
  let t;
  const wake = () => { bar.classList.remove('hidden'); clearTimeout(t); t = setTimeout(() => bar.classList.add('hidden'), 3000); };
  addEventListener('mousemove', wake); wake();

  const $ = (s) => document.querySelector(s);
  window.__mock = { reactions: [], presenting: false, camera: false };

  $('#chatbtn').onclick = () => $('#chat').classList.toggle('open');

  // 2. Chat messages: content in ATTRIBUTES, hover UI nested inside (pollutes textContent).
  const post = (sender, text) => {
    const d = document.createElement('div');
    d.className = 'msg';
    d.setAttribute('data-message-id', 'm' + Date.now() + Math.random());
    d.setAttribute('data-sender-name', sender);
    // REAL Meet shape: the text is a bare node inside the container, NOT a data-message-text
    // attribute, and the hover UI is a nested BUTTON that also carries data-message-id.
    d.appendChild(document.createTextNode(text));
    const keep = document.createElement('button');
    keep.setAttribute('data-message-id', d.getAttribute('data-message-id'));
    keep.textContent = 'Hover over a message to pin itkeepPin message';
    d.appendChild(keep);
    $('#msgs').appendChild(d);
  };
  const submit = () => {
    const ta = $('textarea');
    if (ta.value.trim()) { post('Vexa E2E', ta.value.trim()); ta.value = ''; }
  };
  $('#send').onclick = submit;
  $('textarea').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); } });

  $('#react').onclick = () => $('#picker').classList.toggle('open');
  for (const b of document.querySelectorAll('#picker button')) {
    b.onclick = () => { const im = b.querySelector('img');
      window.__mock.reactions.push((im ? im.getAttribute('alt') : b.textContent).split(' ')[0]);
      $('#picker').classList.remove('open'); };
  }

  // 3. Camera / share actually consume the patched getUserMedia + getDisplayMedia.
  $('#cam').onclick = async () => {
    const btn = $('#cam');
    if (!window.__mock.camera) {
      const s = await navigator.mediaDevices.getUserMedia({ video: true });
      $('#selfvid').srcObject = s;
      window.__mock.camera = true; window.__mock.camTrack = s.getVideoTracks()[0];
      btn.setAttribute('aria-label', 'Turn off camera');
    } else {
      window.__mock.camera = false; btn.setAttribute('aria-label', 'Turn on camera');
    }
  };
  $('#share').onclick = async () => {
    const btn = $('#share');
    if (!window.__mock.presenting) {
      const s = await navigator.mediaDevices.getDisplayMedia({ video: true });
      window.__mock.presenting = true; window.__mock.shareTrack = s.getVideoTracks()[0];
      btn.removeAttribute('aria-label');            // real Meet: no matching aria-label
      btn.textContent = 'cancel_presentationStop presenting';
      $('#banner').style.display = 'block';
    } else {
      window.__mock.presenting = false; btn.setAttribute('aria-label', 'Share screen'); btn.textContent = 'share';
      $('#banner').style.display = 'none';
    }
  };
</script>
