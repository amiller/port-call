# The same rig, shaped for a dstack / Phala CVM.
#
#   phala deploy -n port-call -c docker-compose.cvm.yml \
#     -e NEAR_API_KEY=... -e ADMIN_TOKEN=... --vcpu 4 --memory 8192 --disk-size 60
#
# IMAGES ARE PINNED LITERALLY and the secrets use PLAIN ${VAR}, never `${VAR:?...}`. Why:
#
# dstack keeps an ALLOWLIST of env names — `allowed_envs` in the deployed app manifest, which for
# this app is exactly [NEAR_API_KEY, ADMIN_TOKEN, DSTACK_AUTHORIZED_KEYS]. Names on it arrive;
# names off it (VEXA_IMAGE, SHIMS_IMAGE, TTS_ENGINE) do not, and a `${VAR:?...}` reference to a
# name that did not arrive ABORTS the boot: the CVM reaches `running` with zero containers, which
# from outside looks like a healthy deploy. That killed port-call-test and -test2.
#
# The secrets themselves DO reach the containers. Proven on port-call-test4: this compose's
# near-shim image refuses to start on an empty NEAR_API_KEY ("refusing to start and pretend to
# transcribe", verified by running the same image with the var empty), and in the CVM its uvicorn
# bound normally. So plain ${VAR} for allowlisted names is correct and sufficient — an earlier
# reading of this file, that both secrets resolve to empty, was an inference and it was wrong.
#
# `image:` cannot be a pass-through at all, so pinning is the only option — and it is the better
# one here, since the compose hash then covers the exact image.
# Bump the two tags on release — nothing does it automatically; promote.sh/deploy-prod.sh neither
# build nor push these images, so this file WILL fall behind prod if the CVM lane goes real.
#
# DO NOT "tidy up" the two ${VAR} environment mappings by deleting them. The upstream image bakes
# ENV ADMIN_API_TOKEN=changeme, so removing the mapping does not leave the token unset — it leaves
# a publicly known admin token on a public gateway. Empty is fail-closed (admin routes 500, no bot
# can be spawned); `changeme` is not.
#
# Why a second file rather than the main one: a CVM is handed ONE compose file and nothing else.
# No build context, no repo, no host filesystem. Phala's own pre-deploy rules reject `build:`,
# `dockerfile:`, `env_file:` and any host bind mount, and every `image:` must be pullable from
# inside the CVM. docker-compose.yml is the development file (it builds from this checkout and
# bind-mounts live/ for hot swap); this one is that file with every host dependency removed.
#
# So the two images must be pushed first:
#   docker build -f Dockerfile.patched -t $VEXA_IMAGE . && docker push $VEXA_IMAGE
#   docker build -f Dockerfile.shims   -t $SHIMS_IMAGE . && docker push $SHIMS_IMAGE
# Both must be amd64 (CVMs are Intel TDX); build on an amd64 host or use --platform linux/amd64.
#
# The shim sources and sfx/ are baked into the shims image, and the bot's src/dist are baked into
# the vexa image — dropping the mounts loses nothing but the ~10s hot-swap loop, which needs a
# host to edit files on and so cannot exist here anyway.
#
# Secrets: never in this file (it is stored in plaintext by the backend). Put NEAR_API_KEY in the
# env file passed to `phala deploy -e`, which is encrypted client side. Drop the near-shim service
# entirely if you have no transcription key — join / speak / chat / camera need no credential;
# transcription is then simply dead, and the bot will say so rather than pretend.
services:
  postgres:
    image: postgres:17-alpine
    command: -c idle_in_transaction_session_timeout=60000
    environment:
      POSTGRES_DB: vexa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vexa"]
      interval: 5s
      timeout: 3s
      retries: 20

  near-shim:
    image: ghcr.io/amiller/port-call-shims:e7bcf85
    command: uvicorn near-shim:app --host 0.0.0.0 --port 8001
    environment:
      NEAR_API_KEY: ${NEAR_API_KEY}
      SHIM_LOG: metrics
    restart: unless-stopped

  tts-shim:
    image: ghcr.io/amiller/port-call-shims:e7bcf85
    command: uvicorn tts-shim:app --host 0.0.0.0 --port 8002
    environment:
      TTS_ENGINE: piper
    restart: unless-stopped

  vexa-lite:
    image: ghcr.io/amiller/port-call-lite:console1
    shm_size: 2gb
    depends_on:
      postgres: {condition: service_healthy}
    ports:
      - "8056:8056"
      - "3000:3000"
      # admin-api. It ALREADY binds 0.0.0.0:8001 (HOST defaults to 0.0.0.0 in
      # admin_api/__main__.py); the rig simply never published it, which is why relaunch.sh mints
      # tokens through `docker exec`. A CVM or a pod tenant has no exec, so without this nothing
      # can mint a bot token and POST /bots is unreachable however healthy the gateway looks.
      #
      # Published, the dstack gateway serves it at <app-id>-8001.<base-domain>, guarded by
      # X-Admin-API-Key: ADMIN_TOKEN. That token is then the entire perimeter for creating users
      # and minting tokens — use a strong one, never the rig's dev value.
      - "8001:8001"
    volumes:
      - recordings:/var/lib/vexa/recordings
      # Same reasoning as the rig compose: a signed-in profile only survives on a volume. Populate
      # it with `phala cp` (SSH into a CVM works: <app-id>-22.<base-domain> on :443) — without it
      # the bot joins anonymously and only OPEN rooms work.
      - google-session:/var/lib/vexa/google-session-live
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: vexa
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSL_MODE: disable
      ADMIN_API_TOKEN: ${ADMIN_TOKEN}
      TRANSCRIPTION_SERVICE_URL: http://near-shim:8001/v1/audio/transcriptions
      TRANSCRIPTION_SERVICE_TOKEN: near
      VEXA_AUDIO_METER: "1"
      TTS_SERVICE_URL: http://tts-shim:8002
    restart: unless-stopped

volumes:
  google-session:
  pgdata:
  recordings:
